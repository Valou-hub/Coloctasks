<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ColocTasks"/>
<meta name="theme-color" content="#0F0F0D"/>
<link rel="manifest" href="manifest.json"/>
<title>ColocTasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0F0F0D;
  --bg2: #1A1A17;
  --bg3: #242420;
  --border: rgba(255,255,255,0.08);
  --text: #F0EFE8;
  --muted: rgba(240,239,232,0.45);
  --accent: #C8F04A;
  --accent2: #4AF0B4;
  --danger: #F04A4A;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
  --nav-h: 70px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

.app { display: flex; flex-direction: column; height: 100%; }
.topbar {
  padding: calc(var(--safe-top) + 12px) 20px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.topbar h1 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.topbar h1 span { color: var(--accent); }
.top-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.week-pill { background: var(--bg3); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); }
.week-pill b { color: var(--accent); font-weight: 600; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; transition: background .3s; }
.sync-dot.online { background: var(--accent2); }
.sync-dot.syncing { background: #F0B44A; animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--nav-h) + var(--safe-bottom) + 16px); }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(15,15,13,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding-top: 10px; z-index: 100;
}
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 10px; padding: 0 20px; transition: color .2s; }
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }

.prog-wrap { margin-bottom: 14px; }
.prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.prog-label b { color: var(--accent); font-weight: 600; font-size: 13px; }
.prog-bg { height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 6px; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

.add-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.add-row { display: flex; gap: 8px; }
.inp { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 14px; outline: none; transition: border-color .2s; }
.inp:focus { border-color: var(--accent); }
.sel { appearance: none; -webkit-appearance: none; background-image: none; }
.btn { background: var(--accent); color: #0F0F0D; border: none; border-radius: 12px; padding: 11px 18px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity .15s; }
.btn:active { opacity: .7; }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-pill { flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 99px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: all .15s; }
.filter-pill.active { background: var(--accent); color: #0F0F0D; border-color: var(--accent); font-weight: 600; }

.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; transition: opacity .2s; }
.task-item.done-item { opacity: .5; }
.check-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; font-size: 13px; }
.check-btn.checked { background: var(--accent2); border-color: var(--accent2); }
.task-body { flex: 1; min-width: 0; }
.task-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-name.striked { text-decoration: line-through; color: var(--muted); }
.task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.chip-high { background: rgba(240,74,74,.18); color: #F08A8A; }
.chip-med { background: rgba(240,159,39,.18); color: #F0B96A; }
.chip-low { background: rgba(74,240,180,.18); color: var(--accent2); }
.chip-pts { background: rgba(200,240,74,.14); color: var(--accent); }
.chip-cat { background: var(--bg2); color: var(--muted); border: 1px solid var(--border); }
.task-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.assign-sel { font-size: 11px; background: var(--bg2); border: 1px solid var(--border); border-radius: 7px; color: var(--muted); padding: 3px 6px; font-family: 'DM Sans', sans-serif; max-width: 90px; appearance: none; -webkit-appearance: none; cursor: pointer; }
.del-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px; }
.empty-state { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
.empty-icon { font-size: 36px; margin-bottom: 10px; }

.rank-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.rank-card { border-radius: 14px; border: 1px solid var(--border); padding: 10px 6px; text-align: center; background: var(--bg2); }
.rank-icon { font-size: 22px; margin-bottom: 4px; }
.rank-name { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; }
.rank-req { font-size: 9px; color: var(--muted); margin-top: 2px; }

.lb-list { display: flex; flex-direction: column; gap: 10px; }
.lb-item { display: flex; align-items: center; gap: 12px; }
.lb-pos { width: 28px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; flex-shrink: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
.lb-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
.rank-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; font-family: 'Syne', sans-serif; }
.lb-bar-bg { height: 4px; background: var(--bg3); border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
.lb-bar { height: 4px; border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.lb-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.lb-pts { color: var(--accent); font-weight: 600; }

.member-card { display: flex; align-items: center; gap: 12px; }
.member-info { flex: 1; }
.member-name-txt { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.member-sub { font-size: 11px; color: var(--muted); }

.toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #0F0F0D; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 20px; border-radius: 99px; white-space: nowrap; opacity: 0; transition: all .3s cubic-bezier(.4,0,.2,1); pointer-events: none; z-index: 200; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.install-banner { background: linear-gradient(135deg, var(--bg2), var(--bg3)); border: 1px solid var(--accent); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
.install-icon { font-size: 28px; flex-shrink: 0; }
.install-text { flex: 1; }
.install-text b { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); }
.install-text p { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.install-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0; line-height: 1; }
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* Loading screen */
.loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity .4s; }
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 12px; }
.loading-logo span { color: var(--accent); }
.loading-bar-bg { width: 120px; height: 3px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.loading-bar { height: 3px; background: var(--accent); border-radius: 99px; animation: load 1.5s ease-in-out infinite; }
@keyframes load { 0%{width:0%} 60%{width:100%} 100%{width:100%} }
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loading">
  <div class="loading-logo">Coloc<span>Tasks</span></div>
  <div class="loading-bar-bg"><div class="loading-bar"></div></div>
</div>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Coloc<span>Tasks</span></h1>
      <div class="top-sub"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Connexion…</span></div>
    </div>
    <div class="week-pill" id="week-prog">0/<b>0</b></div>
  </div>
  <div class="content" id="main-content"></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showTab('tasks')" id="nav-tasks"><span class="nav-icon">✅</span><span>Tâches</span></button>
    <button class="nav-btn" onclick="showTab('ranking')" id="nav-ranking"><span class="nav-icon">🏆</span><span>Classement</span></button>
    <button class="nav-btn" onclick="showTab('members')" id="nav-members"><span class="nav-icon">👥</span><span>Membres</span></button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuEW_DoAZhROZAwtLzX4hxJ1yGqFnFouM",
  authDomain: "coloctasks.firebaseapp.com",
  databaseURL: "https://coloctasks-default-rtdb.firebaseio.com",
  projectId: "coloctasks",
  storageBucket: "coloctasks.firebasestorage.app",
  messagingSenderId: "287788066696",
  appId: "1:287788066696:web:dd41aaa688a1e1f932fc3d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ─── RANKS ───────────────────────────────────────────────
const RANKS = [
  { name:'Fer',          icon:'⚙️',  min:0,   max:14,  barColor:'#888780', bg:'rgba(136,135,128,.15)', textColor:'#B8B6AF' },
  { name:'Bronze',       icon:'🥉',  min:15,  max:34,  barColor:'#CD7F32', bg:'rgba(205,127,50,.18)',  textColor:'#E8A46A' },
  { name:'Argent',       icon:'🪙',  min:35,  max:59,  barColor:'#C0C0C0', bg:'rgba(192,192,192,.15)', textColor:'#D8D8D8' },
  { name:'Or',           icon:'🥇',  min:60,  max:99,  barColor:'#EFC050', bg:'rgba(239,192,80,.18)',  textColor:'#F0D080' },
  { name:'Platine',      icon:'💠',  min:100, max:149, barColor:'#4AF0B4', bg:'rgba(74,240,180,.15)',  textColor:'#7AF0C8' },
  { name:'Diamant',      icon:'🔷',  min:150, max:224, barColor:'#60B0FF', bg:'rgba(96,176,255,.18)',  textColor:'#90C8FF' },
  { name:'Maître',       icon:'⚡',  min:225, max:349, barColor:'#A080FF', bg:'rgba(160,128,255,.18)', textColor:'#C0A8FF' },
  { name:'Grand Maître', icon:'👑',  min:350, max:Infinity, barColor:'#F0A040', bg:'rgba(240,160,64,.2)', textColor:'#FFD080' },
];
const AVATARBG  = ['#2D3A1F','#1A2D35','#35271A','#2D1A35','#1A2D2D','#35201A'];
const AVATARTXT = ['#C8F04A','#4AF0E0','#F0B44A','#D44AF0','#4AF4A4','#F06A4A'];

function getRank(pts){ for(let i=RANKS.length-1;i>=0;i--){ if(pts>=RANKS[i].min) return RANKS[i]; } return RANKS[0]; }
function getNext(pts){ for(let i=0;i<RANKS.length;i++){ if(pts<RANKS[i].min) return RANKS[i]; } return null; }

// ─── STATE (local mirror of Firebase) ────────────────────
let S = { members:{}, tasks:{}, tab:'tasks', filter:'all', installDismissed:false };

// ─── SYNC STATUS ─────────────────────────────────────────
function setSyncStatus(status){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-label');
  if(!dot||!lbl) return;
  dot.className='sync-dot';
  if(status==='online'){ dot.classList.add('online'); lbl.textContent='Synchronisé ✓'; }
  else if(status==='syncing'){ dot.classList.add('syncing'); lbl.textContent='Synchronisation…'; }
  else { lbl.textContent='Hors ligne'; }
}

// ─── FIREBASE LISTENERS ──────────────────────────────────
let firstLoad = true;
onValue(ref(db,'coloctasks'), snapshot => {
  const data = snapshot.val() || {};
  S.members = data.members || {};
  S.tasks   = data.tasks   || {};
  setSyncStatus('online');
  if(firstLoad){
    firstLoad=false;
    document.getElementById('loading').classList.add('hidden');
  }
  render();
}, err => {
  setSyncStatus('offline');
  document.getElementById('loading').classList.add('hidden');
});

// ─── UTILS ───────────────────────────────────────────────
function initials(n){ return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function membersArray(){ return Object.entries(S.members).map(([id,m])=>({...m,id})); }
function tasksArray(){   return Object.entries(S.tasks).map(([id,t])=>({...t,id})); }
function avBg(idx){ return AVATARBG[idx%AVATARBG.length]; }
function avTxt(idx){ return AVATARTXT[idx%AVATARTXT.length]; }

function toast(msg){
