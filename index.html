<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ColocTasks"/>
<meta name="theme-color" content="#0F0F0D"/>
<link rel="manifest" href="manifest.json"/>
<title>ColocTasks</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg:#0F0F0D;--bg2:#1A1A17;--bg3:#242420;
  --border:rgba(255,255,255,0.08);--text:#F0EFE8;
  --muted:rgba(240,239,232,0.45);--accent:#C8F04A;--accent2:#4AF0B4;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bottom:env(safe-area-inset-bottom,20px);
  --nav-h:70px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.topbar{padding:calc(var(--safe-top)+12px) 20px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px}
.topbar h1 span{color:var(--accent)}
.top-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.ok{background:var(--accent2)}.dot.sync{background:#F0B44A;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.week-pill{background:var(--bg3);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--muted);border:1px solid var(--border)}
.week-pill b{color:var(--accent);font-weight:600}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav-h)+var(--safe-bottom)+16px)}
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h)+var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(15,15,13,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;padding:0 14px;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:20px;line-height:1}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.prog-label b{color:var(--accent);font-size:13px}
.prog-bg{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog-fill{height:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .5s}
.add-form{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.add-row{display:flex;gap:8px}
.inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.sel{appearance:none;-webkit-appearance:none}
.btn{background:var(--accent);color:#0F0F0D;border:none;border-radius:12px;padding:11px 18px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fp{flex-shrink:0;background:var(--bg3);border:1px solid var(--border);border-radius:99px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.fp.active{background:var(--accent);color:#0F0F0D;border-color:var(--accent);font-weight:600}
.task-list{display:flex;flex-direction:column;gap:8px}
.ti{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:opacity .2s}
.ti.done{opacity:.5}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:13px;color:#0F0F0D}
.chk.on{background:var(--accent2);border-color:var(--accent2)}
.tbody{flex:1;min-width:0}
.tname{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tname.s{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px}
.ch{background:rgba(240,74,74,.18);color:#F08A8A}
.cm{background:rgba(240,159,39,.18);color:#F0B96A}
.cl{background:rgba(74,240,180,.18);color:var(--accent2)}
.cp{background:rgba(200,240,74,.14);color:var(--accent)}
.cc{background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
.tright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.asel{font-size:11px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;color:var(--muted);padding:3px 6px;font-family:'DM Sans',sans-serif;max-width:90px;appearance:none;-webkit-appearance:none;cursor:pointer}
.dbtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:2px}
.empty{text-align:center;padding:40px 0;color:var(--muted);font-size:14px}
.ei{font-size:36px;margin-bottom:10px}
/* Ranks */
.rank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.rc{border-radius:14px;border:1px solid var(--border);padding:10px 6px;text-align:center;background:var(--bg2)}
.ri{font-size:22px;margin-bottom:4px}.rn{font-family:'Syne',sans-serif;font-size:10px;font-weight:700}.rr{font-size:9px;color:var(--muted);margin-top:2px}
/* Leaderboard */
.lb-list{display:flex;flex-direction:column;gap:10px}
.lbi{display:flex;align-items:center;gap:12px}
.lbp{width:28px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-align:center;flex-shrink:0}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;flex-shrink:0}
.lbinfo{flex:1;min-width:0}
.lbnr{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.lbn{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.rbadge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;font-family:'Syne',sans-serif}
.lbbb{height:4px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:4px}
.lbb{height:4px;border-radius:99px;transition:width .6s}
.lbs{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.lbpts{color:var(--accent);font-weight:600}
/* Members */
.mcard{display:flex;align-items:center;gap:12px}
.minfo{flex:1}
.mname{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:2px}
.msub{font-size:11px;color:var(--muted)}
/* Toast */
.toast{position:fixed;bottom:calc(var(--nav-h)+var(--safe-bottom)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#0F0F0D;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px 20px;border-radius:99px;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Loading */
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.loading h2{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
.loading h2 span{color:var(--accent)}
.spin{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.div{height:1px;background:var(--border);margin:12px 0}
/* History */
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;margin-bottom:12px;overflow:hidden}
.day-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.day-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.day-sub{font-size:12px;color:var(--muted);margin-top:2px}
.day-badge{font-size:20px}
.day-body{padding:0 16px 14px;border-top:1px solid var(--border)}
.day-member-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.day-member-row:last-child{border-bottom:none;padding-bottom:0}
.day-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:800;flex-shrink:0}
.day-member-info{flex:1}
.day-member-name{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.day-pts-badge{font-size:11px;color:var(--accent);font-weight:600}
.day-task-list{display:flex;flex-direction:column;gap:3px}
.day-task-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.day-task-item:before{content:'✓';color:var(--accent2);font-size:11px}
/* Today banner */
.today-banner{background:linear-gradient(135deg,rgba(200,240,74,.08),rgba(74,240,180,.06));border:1px solid rgba(200,240,74,.2);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.today-date{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent)}
.today-sub{font-size:11px;color:var(--muted);margin-top:2px}
.countdown{font-family:'Syne',sans-serif;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.countdown b{color:var(--accent2);display:block;font-size:16px}
/* Notif */
.notif-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.notif-row:last-child{border-bottom:none;padding-bottom:0}
.notif-row:first-child{padding-top:0}
.notif-label{font-size:14px;font-weight:500}
.notif-sub{font-size:11px;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg3);border-radius:99px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--accent);border-color:var(--accent)}
.toggle-track:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle input:checked+.toggle-track:before{transform:translateX(18px)}
.my-profile-card{display:flex;align-items:center;gap:12px;padding:4px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.change-btn{font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--muted);padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif}
/* Profile overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:24px 20px calc(var(--safe-bottom)+24px);width:100%;max-width:480px;border-top:1px solid var(--border)}
.sheet h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:6px}
.sheet p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.profile-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.profile-btn{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:12px 16px;cursor:pointer;transition:border-color .2s;width:100%}
.profile-btn:active{opacity:.7}
.profile-btn.selected{border-color:var(--accent)}
.profile-btn .av{width:40px;height:40px;font-size:14px;flex-shrink:0}
.profile-btn-info{flex:1;text-align:left}
.profile-btn-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.profile-btn-pts{font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spin"></div>
  <h2>Coloc<span>Tasks</span></h2>
  <div style="font-size:13px;color:var(--muted)" id="load-msg">Connexion…</div>
</div>

<div class="app" style="opacity:0;transition:opacity .4s" id="app">
  <div class="topbar">
    <div>
      <h1>Coloc<span>Tasks</span></h1>
      <div class="top-sub"><span class="dot" id="dot"></span><span id="sync-lbl">Connexion…</span></div>
    </div>
    <div class="week-pill" id="wp">0/<b>0</b></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showTab('tasks')" id="nav-tasks"><span class="nav-icon">✅</span><span>Tâches</span></button>
    <button class="nav-btn" onclick="showTab('ranking')" id="nav-ranking"><span class="nav-icon">🏆</span><span>Classement</span></button>
    <button class="nav-btn" onclick="showTab('history')" id="nav-history"><span class="nav-icon">📅</span><span>Historique</span></button>
    <button class="nav-btn" onclick="showTab('members')" id="nav-members"><span class="nav-icon">👥</span><span>Membres</span></button>
    <button class="nav-btn" onclick="showTab('settings')" id="nav-settings"><span class="nav-icon">🔔</span><span>Notifs</span></button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<div class="overlay" id="profile-overlay" style="display:none">
  <div class="sheet">
    <h3>👋 Qui es-tu ?</h3>
    <p>Choisis ton profil pour recevoir les bonnes notifications sur ce téléphone.</p>
    <div class="profile-list" id="profile-list"></div>
    <div style="font-size:12px;color:var(--muted);text-align:center">Tu pourras changer ça dans Notifications</div>
  </div>
</div>

<script>
// ── Firebase ───────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyCuEW_DoAZhROZAwtLzX4hxJ1yGqFnFouM",
  authDomain:"coloctasks.firebaseapp.com",
  databaseURL:"https://coloctasks-default-rtdb.firebaseio.com",
  projectId:"coloctasks",
  storageBucket:"coloctasks.firebasestorage.app",
  messagingSenderId:"287788066696",
  appId:"1:287788066696:web:dd41aaa688a1e1f932fc3d"
});
const db = firebase.database();

// ── Ranks ──────────────────────────────────────────────
const RANKS=[
  {name:'Fer',         icon:'⚙️',min:0,  bar:'#888780',bg:'rgba(136,135,128,.15)',txt:'#B8B6AF'},
  {name:'Bronze',      icon:'🥉',min:15, bar:'#CD7F32',bg:'rgba(205,127,50,.18)', txt:'#E8A46A'},
  {name:'Argent',      icon:'🪙',min:35, bar:'#C0C0C0',bg:'rgba(192,192,192,.15)',txt:'#D8D8D8'},
  {name:'Or',          icon:'🥇',min:60, bar:'#EFC050',bg:'rgba(239,192,80,.18)', txt:'#F0D080'},
  {name:'Platine',     icon:'💠',min:100,bar:'#4AF0B4',bg:'rgba(74,240,180,.15)', txt:'#7AF0C8'},
  {name:'Diamant',     icon:'🔷',min:150,bar:'#60B0FF',bg:'rgba(96,176,255,.18)', txt:'#90C8FF'},
  {name:'Maître',      icon:'⚡',min:225,bar:'#A080FF',bg:'rgba(160,128,255,.18)',txt:'#C0A8FF'},
  {name:'Grand Maître',icon:'👑',min:350,bar:'#F0A040',bg:'rgba(240,160,64,.2)',  txt:'#FFD080'},
];
const ABG =['#2D3A1F','#1A2D35','#35271A','#2D1A35','#1A2D2D','#35201A'];
const ATXT=['#C8F04A','#4AF0E0','#F0B44A','#D44AF0','#4AF4A4','#F06A4A'];
function getRank(p){for(let i=RANKS.length-1;i>=0;i--)if(p>=RANKS[i].min)return RANKS[i];return RANKS[0]}
function getNext(p){for(let i=0;i<RANKS.length;i++)if(p<RANKS[i].min)return RANKS[i];return null}

// ── Local prefs ────────────────────────────────────────
let prefs={myMemberId:null,notifEnabled:true,notifAssigned:true,notifCompleted:true,notifUrgent:true,notifDaily:true,dailyTime:'08:00'};
function loadPrefs(){try{const d=localStorage.getItem('ct_prefs');if(d)prefs=Object.assign(prefs,JSON.parse(d))}catch(e){}}
function savePrefs(){try{localStorage.setItem('ct_prefs',JSON.stringify(prefs))}catch(e){}}
loadPrefs();

// ── State ──────────────────────────────────────────────
let S={members:{},tasks:{},history:{},filter:'all',tab:'tasks'};
let swReg=null;
let midnightTimer=null;
let countdownTimer=null;

function ini(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function abg(id){const k=Object.keys(S.members);return ABG[k.indexOf(id)%ABG.length]||ABG[0]}
function atxt(id){const k=Object.keys(S.members);return ATXT[k.indexOf(id)%ATXT.length]||ATXT[0]}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(key){
  const [y,m,d]=key.split('-');
  const date=new Date(y,m-1,d);
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  return days[date.getDay()]+' '+d+' '+months[m-1];
}
function msToMidnight(){
  const now=new Date();
  const midnight=new Date(now);
  midnight.setHours(24,0,0,0);
  return midnight-now;
}
function formatCountdown(ms){
  const h=Math.floor(ms/3600000);
  const m=Math.floor((ms%3600000)/60000);
  const s=Math.floor((ms%60000)/1000);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function syncDot(s){
  const d=document.getElementById('dot'),l=document.getElementById('sync-lbl');
  if(!d||!l)return;
  d.className='dot '+(s==='ok'?'ok':s==='sync'?'sync':'');
  l.textContent={ok:'Synchronisé ✓',sync:'Sync…',off:'Hors ligne ⚠️'}[s]||'';
}
function toast(msg,dur=2400){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),dur);
}

// ── Service worker ─────────────────────────────────────
async function initSW(){
  if(!('serviceWorker' in navigator))return;
  try{swReg=await navigator.serviceWorker.register('./sw.js')}catch(e){}
}
async function requestNotifPermission(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  return(await Notification.requestPermission())==='granted';
}
function sendNotif(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'SHOW_NOTIFICATION',title,body,tag});
  } else { new Notification(title,{body,icon:'./icon-192.png',tag}); }
}

// ── Daily reset logic ──────────────────────────────────
async function runDailyReset(){
  const key=todayKey(); // this is actually yesterday at midnight trigger
  // Save today's snapshot to history before resetting
  await saveDayToHistory();
  // Reset all tasks to not done
  const updates={};
  Object.entries(S.tasks).forEach(([id])=>{
    updates['coloc/tasks/'+id+'/done']=false;
    updates['coloc/tasks/'+id+'/assignedTo']=null;
  });
  // Reset daily pts for all members
  Object.entries(S.members).forEach(([id])=>{
    updates['coloc/members/'+id+'/dailyPts']=0;
  });
  if(Object.keys(updates).length) await db.ref().update(updates);
  sendNotif('🌅 Nouveau jour !','Les tâches ont été remises à zéro. C\'est parti !','daily-reset');
  toast('🌅 Nouveau jour ! Tâches remises à zéro.');
  scheduleMidnightReset();
}

async function saveDayToHistory(){
  const key=todayKey();
  const tasks=Object.values(S.tasks);
  const doneTasks=tasks.filter(t=>t.done);
  if(!doneTasks.length)return; // nothing to save
  // Build per-member summary
  const memberSummary={};
  doneTasks.forEach(t=>{
    if(!t.assignedTo)return;
    if(!memberSummary[t.assignedTo]) memberSummary[t.assignedTo]={pts:0,tasks:[]};
    memberSummary[t.assignedTo].pts+=t.pts;
    memberSummary[t.assignedTo].tasks.push(t.name);
  });
  const totalDone=doneTasks.length;
  const totalTasks=tasks.length;
  await db.ref('coloc/history/'+key).set({
    date:key,
    totalDone,
    totalTasks,
    members:memberSummary,
    savedAt:Date.now()
  });
  // Add daily pts to total pts
  const ptUpdates={};
  Object.entries(memberSummary).forEach(([id,s])=>{
    const m=S.members[id];
    if(m) ptUpdates['coloc/members/'+id+'/pts']=(m.pts||0)+s.pts;
  });
  if(Object.keys(ptUpdates).length) await db.ref().update(ptUpdates);
}

function scheduleMidnightReset(){
  if(midnightTimer)clearTimeout(midnightTimer);
  const ms=msToMidnight();
  midnightTimer=setTimeout(()=>{ runDailyReset(); },ms);
  // Also check if we missed a reset (app was closed at midnight)
  checkMissedReset();
}

function checkMissedReset(){
  // If lastResetDate in Firebase is not today, trigger reset
  db.ref('coloc/meta/lastResetDate').once('value',snap=>{
    const last=snap.val();
    const today=todayKey();
    if(last && last!==today){
      // Missed one or more resets — run now
      runDailyReset();
    } else if(!last) {
      db.ref('coloc/meta/lastResetDate').set(today);
    }
  });
}

// Update lastResetDate whenever reset runs
async function runDailyResetWithMeta(){
  await db.ref('coloc/meta/lastResetDate').set(todayKey());
  await runDailyReset();
}

// ── Countdown ticker ───────────────────────────────────
function startCountdown(){
  if(countdownTimer)clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    const el=document.getElementById('countdown-val');
    if(el) el.textContent=formatCountdown(msToMidnight());
  },1000);
}

// ── Firebase listener ──────────────────────────────────
let first=true;
let prevTasks={},prevMembers={};

db.ref('coloc').on('value',snap=>{
  const d=snap.val()||{};
  const newTasks=d.tasks||{};
  const newMembers=d.members||{};

  // Notifications
  if(!first&&prefs.notifEnabled){
    if(prefs.notifAssigned&&prefs.myMemberId){
      Object.entries(newTasks).forEach(([id,t])=>{
        const old=prevTasks[id];
        if(t.assignedTo===prefs.myMemberId&&(!old||old.assignedTo!==prefs.myMemberId)){
          sendNotif('📌 Nouvelle tâche assignée !','"'+t.name+'" t\'a été assignée.','assigned-'+id);
        }
      });
    }
    if(prefs.notifCompleted){
      Object.entries(newTasks).forEach(([id,t])=>{
        const old=prevTasks[id];
        if(t.done&&old&&!old.done&&t.assignedTo&&t.assignedTo!==prefs.myMemberId){
          const who=newMembers[t.assignedTo];
          if(who) sendNotif('✅ Tâche complétée !',who.name+' a fait : "'+t.name+'" (+'+t.pts+' pts)','done-'+id);
        }
      });
    }
  }

  prevTasks=JSON.parse(JSON.stringify(newTasks));
  prevMembers=JSON.parse(JSON.stringify(newMembers));
  S.members=newMembers;
  S.tasks=newTasks;
  S.history=d.history||{};
  syncDot('ok');

  if(first){
    first=false;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.opacity='1';
    if(!prefs.myMemberId||!S.members[prefs.myMemberId]) showProfilePicker();
    scheduleMidnightReset();
    startCountdown();
  }
  render();
},err=>{syncDot('off');document.getElementById('load-msg').textContent='Erreur: '+err.message});

// ── Actions ────────────────────────────────────────────
function addTask(){
  const inp=document.getElementById('ti');
  const name=inp.value.trim();if(!name)return;
  syncDot('sync');
  db.ref('coloc/tasks').push({name,cat:document.getElementById('tc').value,prio:document.getElementById('tp').value,pts:parseInt(document.getElementById('tpts').value),done:false,assignedTo:null,createdAt:Date.now()});
  inp.value='';toast('Tâche ajoutée ! ✅');
}

function toggleTask(id){
  const t=S.tasks[id];if(!t)return;
  syncDot('sync');
  const u={};
  u['coloc/tasks/'+id+'/done']=!t.done;
  if(t.assignedTo&&S.members[t.assignedTo]){
    const m=S.members[t.assignedTo];
    // Update daily pts
    const prevDaily=m.dailyPts||0;
    const newDaily=t.done?Math.max(0,prevDaily-t.pts):prevDaily+t.pts;
    u['coloc/members/'+t.assignedTo+'/dailyPts']=newDaily;
    if(!t.done) toast('+'+t.pts+' pts pour '+m.name+' aujourd\'hui !');
  }
  db.ref().update(u);
}

function delTask(id){
  const t=S.tasks[id];
  if(t&&t.done&&t.assignedTo&&S.members[t.assignedTo]){
    const m=S.members[t.assignedTo];
    db.ref('coloc/members/'+t.assignedTo+'/dailyPts').set(Math.max(0,(m.dailyPts||0)-t.pts));
  }
  db.ref('coloc/tasks/'+id).remove();
}

function assignTask(taskId,val){
  const t=S.tasks[taskId];if(!t)return;
  syncDot('sync');
  const u={};
  if(t.done&&t.assignedTo&&S.members[t.assignedTo]){
    const old=S.members[t.assignedTo];
    u['coloc/members/'+t.assignedTo+'/dailyPts']=Math.max(0,(old.dailyPts||0)-t.pts);
  }
  const na=val||null;
  u['coloc/tasks/'+taskId+'/assignedTo']=na;
  if(t.done&&na&&S.members[na]){
    const m=S.members[na];
    u['coloc/members/'+na+'/dailyPts']=(m.dailyPts||0)+t.pts;
  }
  db.ref().update(u);
}

function addMember(){
  const inp=document.getElementById('mi');
  const name=inp.value.trim();if(!name)return;
  syncDot('sync');
  db.ref('coloc/members').push({name,pts:0,dailyPts:0,joinedAt:Date.now()});
  inp.value='';toast(name+' a rejoint la coloc ! 🎉');
}

function delMember(id){
  syncDot('sync');
  const u={};
  Object.entries(S.tasks).forEach(([tid,t])=>{if(t.assignedTo===id)u['coloc/tasks/'+tid+'/assignedTo']=null;});
  if(Object.keys(u).length)db.ref().update(u);
  db.ref('coloc/members/'+id).remove();
  if(prefs.myMemberId===id){prefs.myMemberId=null;savePrefs();}
}

function render(){
  const tasks=Object.values(S.tasks);
  const done=tasks.filter(t=>t.done).length,total=tasks.length;

  const wp=document.getElementById('wp');if(wp)wp.innerHTML=done+'/<b>'+total+'</b>';
  const el=document.getElementById('content');if(!el)return;
  if(S.tab==='tasks')   el.innerHTML=renderTasks(done,total,pct);
  if(S.tab==='ranking') el.innerHTML=renderRanking();
  if(S.tab==='history') el.innerHTML=renderHistory();
  if(S.tab==='members') el.innerHTML=renderMembers();
  if(S.tab==='settings')el.innerHTML=renderSettings();
  if(S.tab==='tasks') startCountdown();
}

  const toggle=(key,label,sub)=>'<div class="notif-row"><div><div class="notif-label">'+label+'</div><div class="notif-sub">'+sub+'</div></div><label class="toggle"><input type="checkbox" '+(prefs[key]?'checked':'')+' onchange="togglePref(\''+key+'\')"/><div class="toggle-track"></div></label></div>';
  return profileSection
    +'<div class="card"><div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Notifications</div>'
    +notifStatus
    +toggle('notifEnabled','Activer les notifications','Maître interrupteur')
    +toggle('notifAssigned','Tâche assignée','Quand quelqu\'un t\'assigne une tâche')
    +toggle('notifCompleted','Tâche complétée','Quand un co-loc finit une tâche')
    +toggle('notifUrgent','Rappel urgences','Rappel toutes les 2h')
    +toggle('notifDaily','Résumé quotidien','Récap de l\'état des tâches')
    +'</div>'
    +'<div class="card" style="text-align:center"><button class="btn btn-ghost" onclick="testNotif()" style="width:100%">🔔 Tester une notification</button></div>';
}

async function requestAndEnable(){
  const ok=await requestNotifPermission();
  toast(ok?'Notifications activées ! 🔔':'Notifications refusées :(');render();
}
function testNotif(){
  if(Notification.permission!=='granted'){toast('Active les notifications d\'abord !');return;}
  sendNotif('🔔 Test ColocTasks','Les notifications fonctionnent !','test');
  toast('Notification envoyée !');
}

initSW();
</script>
</body>
</html>
